[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-gap-analyzer"
version = "0.1.0"
description = "Finds security gaps in Microsoft Entra ID Conditional Access configurations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["entra-id", "conditional-access", "identity-security", "microsoft-graph", "azure"]
dependencies = [
    "msal>=1.28",       # Microsoft's sign-in library
    "requests>=2.31",   # HTTP calls to Microsoft Graph
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/wesleyy720/ca-gap-analyzer"

[project.scripts]
ca-gap-analyzer = "ca_gap_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes (real bugs), import order, bugbear (likely mistakes)
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ca_gap_analyzer", "conftest"]
combine-as-imports = true
